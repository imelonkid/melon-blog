# 纸上得来 —— OpenResty / nginx 站点配置片段
#
# 用法（1Panel）：
#   网站 → 创建网站 → 静态网站，域名填 melonkid.cn
#   1Panel 会生成 vhost 并给出根目录路径，把 dist/ 里的内容传进去
#   然后在「网站设置 → 配置文件」里把下面的内容合并进 server 块
#
# 注意：站内有中文路径（如 /posts/令牌桶的java实现），上传时务必用
# rsync 或 tar 保留 UTF-8 文件名，用 zip 在跨平台解压时容易变成乱码，
# 那些文章会 404。

charset utf-8;

# Astro 生成的是 posts/<slug>/index.html，而站内链接不带尾斜杠。
# try_files 直接命中 index.html，省掉一次 301 跳转。
location / {
    try_files $uri $uri/index.html $uri/ =404;
}

# 带内容哈希的构建产物，改动必然换文件名，可以永久缓存
location /_astro/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
}

# 图片没有哈希，缓存但留出更新余地
location /images/ {
    expires 7d;
    add_header Cache-Control "public";
}

# HTML 不能缓存，否则发了新文章读者还看到旧列表
location ~* \.html$ {
    add_header Cache-Control "no-cache";
}

# RSS 和 sitemap 同理，短缓存即可
location ~* \.(xml)$ {
    expires 1h;
}

error_page 404 /404.html;

gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types
    text/plain
    text/css
    text/html
    application/xml
    application/rss+xml
    application/javascript
    image/svg+xml;
