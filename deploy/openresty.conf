# 纸上得来 —— OpenResty 站点配置（melonkid.cn）
#
# 这是在 1Panel 生成的 vhost 基础上合并后的完整配置。
# 用法：1Panel → 网站 → melonkid.cn → 配置文件，整段替换保存。
#
# 相对 1Panel 默认配置，新增的部分都标了「+++」：
#   +++ charset utf-8
#   +++ location / 的 try_files（干净 URL，省掉一次 301）
#   +++ 分级缓存策略
#   +++ gzip
#
# 注意：nginx 的 add_header 是就近覆盖的——某个 location 里写了 add_header，
# server 级的 Strict-Transport-Security 在该 location 就会失效。所以下面
# 每个加缓存头的 location 都重写了一遍 HSTS。

server {
    listen 80 ;
    listen 443 ssl ;
    server_name melonkid.cn;
    index index.php index.html index.htm default.php default.htm default.html;
    access_log /www/sites/melonkid.cn/log/access.log main;
    error_log /www/sites/melonkid.cn/log/error.log;

    # +++ 站内有中文路径（/posts/令牌桶的java实现），显式声明编码
    charset utf-8;

    location ~ ^/(\.user.ini|\.htaccess|\.git|\.env|\.svn|\.project|LICENSE|README.md) {
        return 404;
    }
    location ^~ /.well-known/acme-challenge {
        allow all;
        root /usr/share/nginx/html;
    }
    if ( $uri ~ "^/\.well-known/.*\.(php|jsp|py|js|css|lua|ts|go|zip|tar\.gz|rar|7z|sql|bak)$" ) {
        return 403;
    }

    root /www/sites/melonkid.cn/index;
    error_page 404 /404.html;
    http2 on;

    if ($scheme = http) {
        return 301 https://$host$request_uri;
    }

    # +++ Astro 生成的是 posts/<slug>/index.html，站内链接不带尾斜杠。
    # 没有这条时 /about 会先 301 到 /about/ 再返回内容，白白多一个来回。
    location / {
        try_files $uri $uri/index.html $uri/ =404;
        # HTML 一律不缓存，否则发了新文章读者还看到旧列表。
        # 注意必须放在这里：干净 URL（/about、/posts/xxx）不以 .html 结尾，
        # 用 location ~* \.html$ 匹配不到。
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains";
    }

    # +++ 带内容哈希的构建产物，文件名随内容变，可以永久缓存
    location ^~ /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains";
    }

    # +++ KaTeX 的样式与数学字体。版本固定、内容不变，必须长缓存——
    # 少了这条会落到 location / 的 no-cache，每次访问重下 296KB
    location ^~ /katex/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains";
    }

    # +++ 站名字体，几乎不会变
    location ^~ /fonts/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains";
    }

    # +++ 图片没有内容哈希，缓存但留出更新余地
    location ^~ /images/ {
        expires 7d;
        add_header Cache-Control "public";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains";
    }

    # +++ RSS、sitemap、robots 短缓存
    location ~* \.(xml|txt)$ {
        expires 1h;
        add_header Cache-Control "public";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains";
    }

    ssl_certificate /www/sites/melonkid.cn/ssl/fullchain.pem;
    ssl_certificate_key /www/sites/melonkid.cn/ssl/privkey.pem;
    ssl_protocols TLSv1.3 TLSv1.2;
    ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-SHA384:ECDHE-RSA-AES128-SHA256:!aNULL:!eNULL:!EXPORT:!DSS:!DES:!RC4:!3DES:!MD5:!PSK:!KRB5:!SRP:!CAMELLIA:!SEED;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    error_page 497 https://$host$request_uri;

    proxy_set_header X-Forwarded-Proto https;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains";

    # +++ 文本资源压缩
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        text/xml
        application/xml
        application/rss+xml
        application/javascript
        image/svg+xml;
}
